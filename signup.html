<body>
    
    <div class="main">
        <div class="navbar">
            <div class="icon">

            <div class="menu">

                <div class="form">
                    <h2>SIGN UP HERE</h2>
                    <input type="email" id="email" placeholder="Enter Email Here">
                    <input type="password" id="password" placeholder="Enter Password">
                    <input type="password" id="confirmPassword" placeholder="Re-enter Password">
                    <input type="text" id="name" placeholder="Name">
                    <input type="number" id="mobile" placeholder="Enter Mobile Number">
                    <input type="text" id="aadhar" placeholder="Aadhar Number">
                    <input type="text" id="address" placeholder="Enter Address">
                    <input type="date" id="dob">
                    <select id="role">
                        <option value="user">User</option>
                        <option value="agency">Agency</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button class="btnn" id="signupBtn">SUBMIT</button>

                    <!-- This is what will be included inside the popup -->
                    <div class="popup" id="popup">
                      <p>This is a popup!</p>
                      <p>Registration Sucessfull</p>
                      <p>Please Login With Your Credentials.</p>
                      <p>Thank You</p>
                      <a href="#" onclick="hide('popup')">Close</a>
